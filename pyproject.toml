[tool.ruff]
line-length = 100
target-version = "py313"
extend-include = ["src/pre-commit"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "SIM", "C4", "ISC"]
ignore = ["ISC001"]

[tool.ruff.lint.per-file-ignores]
"src/pre-commit" = ["S"]
"tests/*" = ["S"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
disallow_untyped_defs = true
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
addopts = "-ra -q --disable-warnings"
testpaths = ["tests"]
